<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ateliers en ligne - Identité visuelle &amp; Marketing digital</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --lagon: #0F4C5C; --lagon-deep: #0A3642; --lagon-soft: #C9DCE0;
    --ocre: #E3A23B; --ocre-ink: #8A5D0E; --sable: #FAF7F2; --gres: #E4DED3;
    --blanc: #FFFDF9; --ink: #2B2D2F; --soft: #5A5F62; --ok: #2E7D4F; --ko: #B42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sable); color: var(--ink); font-family: Inter, Arial, sans-serif; font-size: 17px; line-height: 1.45; }
  h1, h2, h3 { font-family: "Playfair Display", Georgia, serif; color: var(--lagon); margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 80px; }
  .wrap.large { max-width: 1600px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--ocre-ink); }
  .top h1 { font-size: 34px; line-height: 1.1; margin-top: 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pill { background: var(--lagon); color: var(--sable); border-radius: 30px; padding: 4px 14px; font-size: 13px; font-weight: 600; }
  .pill.ocre { background: var(--ocre); color: var(--lagon-deep); }
  .consigne { margin-top: 14px; color: var(--soft); }
  .tabs { display: flex; gap: 8px; margin: 22px 0 18px; border-bottom: 2px solid var(--gres); }
  .tab { background: none; border: none; padding: 10px 6px; margin-bottom: -2px; font: inherit; font-weight: 600; color: var(--soft); border-bottom: 3px solid transparent; cursor: pointer; }
  .tab.on { color: var(--lagon); border-bottom-color: var(--ocre); }
  .card { background: var(--blanc); border-top: 5px solid var(--lagon); padding: 18px; margin-bottom: 16px; border-radius: 6px; box-shadow: 0 1px 2px rgba(15,76,92,.06); }
  .card h3 { font-size: 21px; margin-bottom: 12px; }
  .card .num { font-family: "Playfair Display", Georgia, serif; color: var(--ocre-ink); font-weight: 700; margin-right: 6px; }
  label { display: block; font-weight: 600; font-size: 15px; margin: 12px 0 6px; }
  .hint { font-weight: 400; color: var(--soft); font-size: 14px; }
  input[type=text], textarea, select { width: 100%; font: inherit; padding: 11px 12px; border: 1.5px solid var(--gres); border-radius: 6px; background: #fff; color: var(--ink); }
  input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--lagon); box-shadow: 0 0 0 3px rgba(15,76,92,.15); }
  textarea { min-height: 90px; resize: vertical; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .color-row { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
  .color-row input[type=color] { width: 56px; height: 48px; border: 1.5px solid var(--gres); border-radius: 6px; padding: 2px; background: #fff; }
  .counter { text-align: right; font-size: 13px; color: var(--soft); margin-top: 4px; }
  .counter.over { color: var(--ko); font-weight: 600; }
  .post-row { border-top: 1px solid var(--gres); padding-top: 10px; margin-top: 10px; }
  .post-row .row3 { grid-template-columns: 1fr 1fr 1fr; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .check { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--gres); color: var(--ink); }
  .check.ok { background: #DFF0E5; color: var(--ok); }
  .check.ko { background: #FBE4E1; color: var(--ko); }
  .btn { display: inline-block; width: 100%; background: var(--lagon); color: var(--sable); border: none; border-radius: 40px; padding: 15px 20px; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; margin-top: 8px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.ghost { background: none; color: var(--lagon); border: 2px solid var(--lagon); }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 6px; display: none; }
  .msg.err { display: block; background: #FBE4E1; color: var(--ko); }
  .msg.ok { display: block; background: #DFF0E5; color: var(--ok); }
  .menu a { display: block; text-decoration: none; background: var(--blanc); border-top: 5px solid var(--lagon); padding: 22px; margin-bottom: 14px; border-radius: 6px; color: var(--ink); }
  .menu a h2 { font-size: 26px; }
  .menu a p { margin: 6px 0 0; color: var(--soft); }
  /* Mur */
  .wall-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .wall-head .count { font-weight: 700; color: var(--lagon); }
  .wall-head .live { font-size: 13px; color: var(--soft); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .large .grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .resp { background: var(--blanc); border-radius: 8px; padding: 18px; border-top: 5px solid var(--lagon); box-shadow: 0 1px 3px rgba(15,76,92,.08); }
  .resp.moi { border-top-color: var(--ocre); box-shadow: 0 0 0 2px var(--ocre); }
  .resp .who { font-family: "Playfair Display", Georgia, serif; font-size: 22px; font-weight: 700; color: var(--lagon); }
  .resp .brand { color: var(--ocre-ink); font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .resp .you { float: right; background: var(--ocre); color: var(--lagon-deep); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .resp .k { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--soft); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--gres); border-radius: 20px; padding: 3px 12px; font-size: 14px; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sw .box { height: 56px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .sw .nm { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .sw .hx { font-size: 12px; color: var(--soft); }
  .fonts .f1 { font-size: 20px; font-weight: 700; color: var(--lagon); }
  .fonts .f2 { font-size: 15px; }
  .phone { border: 3px solid var(--lagon); border-radius: 22px; padding: 12px; margin-top: 12px; background: #fff; }
  .phone .canal { display: inline-block; background: var(--lagon-soft); color: var(--lagon-deep); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
  .phone .pname { font-weight: 700; font-size: 17px; margin-top: 8px; }
  .phone .bio { font-size: 14px; margin-top: 4px; }
  .phone .coord { font-size: 13px; color: var(--soft); margin-top: 6px; }
  .phone .cta { display: block; text-align: center; background: var(--lagon); color: var(--sable); border-radius: 20px; padding: 7px; font-size: 14px; font-weight: 600; margin-top: 10px; }
  .phone .desc { font-size: 13px; color: var(--soft); margin-top: 8px; }
  .plan { width: 100%; border-collapse: collapse; font-size: 14px; }
  .plan td { padding: 6px 4px; border-top: 1px solid var(--gres); vertical-align: top; }
  .plan .pil { font-size: 12px; font-weight: 700; border-radius: 12px; padding: 2px 8px; white-space: nowrap; display: inline-block; }
  .pil.Montrer { background: #DCEBEE; color: var(--lagon-deep); }
  .pil.Apprendre { background: #E8E2F4; color: #4A3A78; }
  .pil.Coulisses { background: #F3E6CF; color: var(--ocre-ink); }
  .pil.Preuve { background: #DFF0E5; color: var(--ok); }
  .pil.Offre { background: #FBE4E1; color: var(--ko); }
  .postbox { background: var(--sable); border-left: 4px solid var(--ocre); padding: 10px 12px; margin-top: 8px; font-size: 14px; }
  .postbox .acc { font-weight: 700; }
  .postbox .cta2 { font-weight: 600; color: var(--lagon); margin-top: 6px; }
  .empty { text-align: center; color: var(--soft); padding: 40px 10px; }
  .large .top h1 { font-size: 44px; }
  .large .resp .who { font-size: 26px; }
  .proj { display: grid; grid-template-columns: 360px 1fr; gap: 40px; align-items: start; }
  .qrbox { position: sticky; top: 24px; background: var(--blanc); border-top: 6px solid var(--ocre); border-radius: 8px; padding: 28px; text-align: center; }
  .qrbox svg { width: 100%; height: auto; display: block; }
  .qrbox .go { font-family: "Playfair Display", Georgia, serif; font-size: 26px; color: var(--lagon); font-weight: 700; margin-bottom: 14px; }
  .qrbox .url { font-size: 20px; font-weight: 700; color: var(--lagon); margin-top: 14px; word-break: break-all; }
  .qrbox .then { font-size: 16px; color: var(--soft); margin-top: 6px; }
  .proj .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .hidden { display: none !important; }
  @media (max-width: 480px) { .row3 { grid-template-columns: 1fr; } .post-row .row3 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="/ateliers/qrcode.js"></script>
<script>
var PARAMS = new URLSearchParams(location.search);
var ATELIER = (PARAMS.get("atelier") || "").toUpperCase();
var MUR = PARAMS.get("mur") === "1";
var PROJ = PARAMS.get("projection") === "1";
var BASE = location.origin + "/ateliers";

var CONF = {
  B: { titre: "Ma mini-charte express", duree: "13 min", module: "Identité visuelle",
       consigne: "Remplissez les 5 cases de votre charte, puis envoyez : elle apparaît aussitôt sur le mur avec celles du groupe." },
  C: { titre: "Mon profil digital", duree: "15 min", module: "Marketing digital",
       consigne: "Choisissez votre canal principal et décrivez votre profil idéal en 6 zones. Vous avez déjà une page ? Notez aussi 3 corrections à faire." },
  D: { titre: "Mes 2 prochaines semaines", duree: "16 min", module: "Marketing digital",
       consigne: "Placez 6 publications sur 2 semaines (3 par semaine), avec 1 seule offre commerciale, puis rédigez entièrement votre premier post." }
};

/* ---------- petits outils ---------- */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function jeton(cle) {
  var k = "jeton_" + cle, t = store(k);
  if (!t) {
    var a = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(a);
    t = Array.prototype.map.call(a, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    store(k, t);
  }
  return t;
}
function input(id, ph, max) { var i = el("input"); i.type = "text"; i.id = id; if (ph) i.placeholder = ph; i.maxLength = max || 120; return i; }
function area(id, ph, max) { var t = el("textarea"); t.id = id; if (ph) t.placeholder = ph; t.maxLength = max || 600; return t; }
function select(id, options, first) {
  var s = el("select"); s.id = id;
  if (first) { var o = el("option", null, first); o.value = ""; s.appendChild(o); }
  options.forEach(function (v) { var o = el("option", null, v); o.value = v; s.appendChild(o); });
  return s;
}
function field(label, ctrl, hint) {
  var w = el("div"), l = el("label", null, label);
  l.htmlFor = ctrl.id || "";
  if (hint) add(l, el("span", "hint", " " + hint));
  return add(w, l, ctrl);
}
function card(n, titre) {
  var c = el("div", "card"), h = el("h3");
  if (n) add(h, el("span", "num", String(n)));
  h.appendChild(document.createTextNode(titre));
  return add(c, h);
}
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
function setVal(id, v) { var e = document.getElementById(id); if (e && v != null) e.value = v; }
function run(fn, args, ok, ko) {
  var cle = args[0], jet = args[1], req;
  if (fn === "envoyer") {
    req = fetch("/api/reponses", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ atelier: cle, jeton: jet, reponse: args[2] }) });
  } else {
    var q = "/api/reponses?atelier=" + encodeURIComponent(cle) + (jet ? "&jeton=" + encodeURIComponent(jet) : "") + (fn === "maReponse" ? "&mien=1" : "");
    req = fetch(q, { cache: "no-store" });
  }
  req.then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) throw new Error((d && d.erreur) || ("erreur " + r.status));
      return d;
    });
  }).then(ok, function (e) { ko(e && e.message ? e.message : String(e)); });
}

/* ---------- en-tête ---------- */
function entete(root) {
  var c = CONF[ATELIER], top = el("div", "top");
  add(top, el("div", "eyebrow", "Atelier " + ATELIER + " · " + c.module), el("h1", null, c.titre));
  if (!MUR && !PROJ) {
    var meta = el("div", "meta");
    add(meta, el("span", "pill", c.duree), el("span", "pill ocre", "Formation du 24/11/2026"));
    add(top, meta, el("p", "consigne", c.consigne));
  }
  root.appendChild(top);
}

/* ---------- menu ---------- */
function menu(root) {
  var top = el("div", "top");
  add(top, el("div", "eyebrow", "B-Lossom Center · 24/11/2026"), el("h1", null, "Ateliers en ligne"),
      el("p", "consigne", "Choisissez l’atelier annoncé par l’animateur."));
  root.appendChild(top);
  var m = el("div", "menu");
  m.style.marginTop = "20px";
  ["B", "C", "D"].forEach(function (k) {
    var a = el("a");
    a.href = BASE + "?atelier=" + k;
    add(a, el("div", "eyebrow", "Atelier " + k + " · " + CONF[k].duree), el("h2", null, CONF[k].titre), el("p", null, CONF[k].consigne));
    m.appendChild(a);
  });
  root.appendChild(m);
}

/* ---------- formulaires ---------- */
var POLICES = ["Playfair Display", "Montserrat", "Poppins", "Lora", "Inter", "Open Sans", "Roboto", "Bebas Neue", "Dancing Script"];

function identite(form) {
  var c = card(null, "Qui êtes-vous ?");
  var nom = input("nom", "Prénom et nom", 80), marque = input("marque", "Nom de votre projet ou marque", 80);
  nom.value = store("nom") || "";
  add(c, field("Votre nom", nom), field("Votre marque ou projet", marque));
  form.appendChild(c);
}

function formB(form) {
  var c1 = card(1, "Mes 3 mots d’ambiance"), r = el("div", "row3");
  add(r, input("amb1", "Calme"), input("amb2", "Authentique"), input("amb3", "Lumineux"));
  add(c1, r); form.appendChild(c1);

  var c2 = card(2, "Mes couleurs");
  add(c2, el("p", "hint", "Touchez le carré pour choisir la couleur, puis donnez-lui un nom."));
  [["c1", "Principale", "#0F4C5C"], ["c2", "Accent", "#E3A23B"], ["c3", "Neutre", "#FAF7F2"]].forEach(function (x) {
    var row = el("div", "color-row"), pick = el("input");
    pick.type = "color"; pick.id = x[0] + "hex"; pick.value = x[2];
    var nm = input(x[0] + "nom", x[1] + " : nom de la couleur", 40);
    add(row, pick, nm);
    add(c2, el("label", null, x[1]), row);
  });
  form.appendChild(c2);

  var c3 = card(3, "Mes 2 polices");
  var dl = el("datalist"); dl.id = "polices";
  POLICES.forEach(function (p) { var o = el("option"); o.value = p; dl.appendChild(o); });
  var p1 = input("pTitres", "Ex. Playfair Display", 40), p2 = input("pTexte", "Ex. Inter", 40);
  p1.setAttribute("list", "polices"); p2.setAttribute("list", "polices");
  add(c3, dl, field("Pour les titres", p1), field("Pour le texte", p2));
  form.appendChild(c3);

  var c4 = card(4, "Mon style d’images");
  add(c4, field("En 3 mots", input("images", "Lumière naturelle, vrais visages, gros plans", 120)));
  form.appendChild(c4);

  var c5 = card(5, "Mon ton");
  var r2 = el("div", "row2");
  add(r2, field("Je suis…", input("tonOui", "Chaleureux", 60)), field("… mais pas…", input("tonNon", "Familier", 60)));
  add(c5, r2, field("2 interdits", input("interdit1", "Ex. logo déformé", 80)), input("interdit2", "Ex. plus de 3 couleurs", 80));
  form.appendChild(c5);
}

function collectB() {
  return {
    ambiance: [val("amb1"), val("amb2"), val("amb3")].filter(Boolean),
    couleurs: ["c1", "c2", "c3"].map(function (k, i) { return { role: ["Principale", "Accent", "Neutre"][i], hex: val(k + "hex"), nom: val(k + "nom") }; }),
    polices: { titres: val("pTitres"), texte: val("pTexte") },
    images: val("images"),
    ton: { oui: val("tonOui"), non: val("tonNon") },
    interdits: [val("interdit1"), val("interdit2")].filter(Boolean)
  };
}
function fillB(d) {
  (d.ambiance || []).forEach(function (v, i) { setVal("amb" + (i + 1), v); });
  (d.couleurs || []).forEach(function (c, i) { setVal("c" + (i + 1) + "hex", c.hex); setVal("c" + (i + 1) + "nom", c.nom); });
  if (d.polices) { setVal("pTitres", d.polices.titres); setVal("pTexte", d.polices.texte); }
  setVal("images", d.images);
  if (d.ton) { setVal("tonOui", d.ton.oui); setVal("tonNon", d.ton.non); }
  (d.interdits || []).forEach(function (v, i) { setVal("interdit" + (i + 1), v); });
}

var CANAUX = ["Page Facebook", "Fiche Google Business Profile", "WhatsApp Business", "Instagram", "TikTok"];
var BOUTONS = ["Envoyer un message", "Réserver", "Appeler", "Itinéraire", "Commander"];

function formC(form) {
  var c0 = card(null, "Mon canal principal");
  add(c0, field("Canal", select("canal", CANAUX, "Choisissez…")));
  form.appendChild(c0);

  var c = card(null, "Mon profil en 6 zones");
  add(c,
    field("1. Photo de profil", input("photo", "Ex. logo carré sur fond bleu", 120), "(votre logo en version carrée)"),
    field("2. Bannière", input("banniere", "Ex. photo du lagon aux couleurs de la charte", 140)),
    field("3. Nom affiché", input("nomAffiche", "Le même sur tous vos canaux", 60)));
  var bio = area("bio", "Votre phrase de positionnement", 150), cnt = el("div", "counter", "0 / 150");
  bio.addEventListener("input", function () { cnt.textContent = bio.value.length + " / 150"; cnt.className = "counter" + (bio.value.length >= 150 ? " over" : ""); });
  add(c, field("4. Bio", bio, "(150 caractères maximum)"), cnt,
    field("5. Coordonnées et horaires", input("coord", "Téléphone, lieu, horaires", 160)),
    field("6. Bouton d’action", select("bouton", BOUTONS, "Choisissez…")));
  form.appendChild(c);

  var c3 = card(null, "Déjà une page ? 3 corrections");
  add(c3, el("p", "hint", "Facultatif : ce que vous allez changer sur votre vraie page."),
    input("corr1", "Correction 1", 120), el("div"), input("corr2", "Correction 2", 120), el("div"), input("corr3", "Correction 3", 120));
  c3.querySelectorAll("input").forEach(function (i) { i.style.marginTop = "8px"; });
  form.appendChild(c3);
}
function collectC() {
  return {
    canal: val("canal"), photo: val("photo"), banniere: val("banniere"), nomAffiche: val("nomAffiche"),
    bio: val("bio"), coord: val("coord"), bouton: val("bouton"),
    corrections: [val("corr1"), val("corr2"), val("corr3")].filter(Boolean)
  };
}
function fillC(d) {
  ["canal", "photo", "banniere", "nomAffiche", "bio", "coord", "bouton"].forEach(function (k) { setVal(k, d[k]); });
  (d.corrections || []).forEach(function (v, i) { setVal("corr" + (i + 1), v); });
}

var JOURS = (function () { var j = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"], o = []; [1, 2].forEach(function (s) { j.forEach(function (x) { o.push(x + " · S" + s); }); }); return o; })();
var PILIERS = ["Montrer", "Apprendre", "Coulisses", "Preuve", "Offre commerciale"];
var FORMATS = ["Photo", "Vidéo courte", "Carrousel", "Story", "Avant / après"];

function formD(form) {
  var c = card(null, "Mes 6 publications");
  add(c, el("p", "hint", "S1 = semaine 1, S2 = semaine 2. Une seule offre commerciale sur les 6."));
  for (var i = 1; i <= 6; i++) {
    var row = el("div", "post-row"), r3 = el("div", "row3");
    add(r3, select("jour" + i, JOURS, "Jour"), select("pilier" + i, PILIERS, "Pilier"), select("format" + i, FORMATS, "Format"));
    add(row, el("div", "eyebrow", "Publication " + i), r3, input("idee" + i, "L’idée en une ligne", 140));
    row.querySelector("input").style.marginTop = "8px";
    c.appendChild(row);
  }
  var checks = el("div", "checks"); checks.id = "checks";
  add(c, checks);
  form.appendChild(c);
  c.addEventListener("change", majChecks); c.addEventListener("input", majChecks);

  var c2 = card(null, "Ma première publication, rédigée");
  add(c2,
    field("Accroche", input("accroche", "La phrase qui arrête le pouce", 140), "(les 3 premières secondes)"),
    field("Texte", area("texte", "2 ou 3 phrases, dans votre ton", 700)),
    field("Appel à l’action", input("cta", "Ex. Écrivez-nous sur WhatsApp", 100)));
  form.appendChild(c2);
  setTimeout(majChecks, 0);
}
function collectD() {
  var posts = [];
  for (var i = 1; i <= 6; i++) posts.push({ jour: val("jour" + i), pilier: val("pilier" + i), format: val("format" + i), idee: val("idee" + i) });
  return { posts: posts, accroche: val("accroche"), texte: val("texte"), cta: val("cta") };
}
function fillD(d) {
  (d.posts || []).forEach(function (p, i) { var n = i + 1; setVal("jour" + n, p.jour); setVal("pilier" + n, p.pilier); setVal("format" + n, p.format); setVal("idee" + n, p.idee); });
  setVal("accroche", d.accroche); setVal("texte", d.texte); setVal("cta", d.cta);
  majChecks();
}
function analyseD(d) {
  var posts = (d.posts || []).filter(function (p) { return p.idee || p.pilier; });
  var offres = posts.filter(function (p) { return p.pilier === "Offre commerciale"; }).length;
  var piliers = {};
  posts.forEach(function (p) { if (p.pilier && p.pilier !== "Offre commerciale") piliers[p.pilier] = 1; });
  return { n: posts.length, offres: offres, piliers: Object.keys(piliers).length };
}
function badges(a, parent) {
  parent.textContent = "";
  add(parent,
    el("span", "check " + (a.n >= 6 ? "ok" : ""), a.n + " / 6 publications"),
    el("span", "check " + (a.piliers >= 4 ? "ok" : ""), a.piliers + " / 4 piliers"),
    el("span", "check " + (a.offres <= 1 ? "ok" : "ko"), a.offres <= 1 ? "Règle 80/20 respectée" : a.offres + " offres : 1 seule maximum"));
}
function majChecks() { var b = document.getElementById("checks"); if (b) badges(analyseD(collectD()), b); }

var FORMS = { B: [formB, collectB, fillB], C: [formC, collectC, fillC], D: [formD, collectD, fillD] };

/* ---------- cartes du mur ---------- */
function carteB(d, box) {
  if (d.couleurs && d.couleurs.length) {
    add(box, el("div", "k", "Couleurs"));
    var s = el("div", "swatches");
    d.couleurs.forEach(function (c) {
      var w = el("div", "sw"), b = el("div", "box");
      if (/^#[0-9a-fA-F]{6}$/.test(c.hex || "")) b.style.background = c.hex;
      add(w, b, el("div", "nm", c.nom || c.role), el("div", "hx", (c.hex || "").toUpperCase()));
      s.appendChild(w);
    });
    box.appendChild(s);
  }
  if (d.ambiance && d.ambiance.length) {
    add(box, el("div", "k", "Ambiance"));
    var ch = el("div", "chips"); d.ambiance.forEach(function (a) { ch.appendChild(el("span", "chip", a)); }); box.appendChild(ch);
  }
  if (d.polices && (d.polices.titres || d.polices.texte)) {
    var f = el("div", "fonts");
    add(f, el("div", "f1", d.polices.titres || "-"), el("div", "f2", d.polices.texte || "-"));
    add(box, el("div", "k", "Polices : titres, texte"), f);
  }
  if (d.images) add(box, el("div", "k", "Images"), el("div", null, d.images));
  if (d.ton && (d.ton.oui || d.ton.non)) add(box, el("div", "k", "Ton"), el("div", null, "Je suis " + (d.ton.oui || "…") + ", mais pas " + (d.ton.non || "…") + "."));
  if (d.interdits && d.interdits.length) {
    add(box, el("div", "k", "Interdits"));
    var ch2 = el("div", "chips"); d.interdits.forEach(function (a) { ch2.appendChild(el("span", "chip", a)); }); box.appendChild(ch2);
  }
}
function carteC(d, box) {
  var p = el("div", "phone");
  if (d.canal) p.appendChild(el("span", "canal", d.canal));
  add(p, el("div", "pname", d.nomAffiche || "Nom affiché"));
  if (d.bio) p.appendChild(el("div", "bio", d.bio));
  if (d.coord) p.appendChild(el("div", "coord", d.coord));
  if (d.bouton) p.appendChild(el("span", "cta", d.bouton));
  if (d.photo) p.appendChild(el("div", "desc", "Photo : " + d.photo));
  if (d.banniere) p.appendChild(el("div", "desc", "Bannière : " + d.banniere));
  box.appendChild(p);
  if (d.corrections && d.corrections.length) {
    add(box, el("div", "k", "Mes 3 corrections"));
    var ul = el("ul"); ul.style.margin = "0"; ul.style.paddingLeft = "18px";
    d.corrections.forEach(function (c) { ul.appendChild(el("li", null, c)); });
    box.appendChild(ul);
  }
}
function carteD(d, box) {
  var posts = (d.posts || []).filter(function (p) { return p.idee || p.pilier; });
  if (posts.length) {
    add(box, el("div", "k", "Planning"));
    var t = el("table", "plan");
    posts.forEach(function (p) {
      var tr = el("tr"), td1 = el("td", null, p.jour || "-"), td2 = el("td"), td3 = el("td", null, (p.format ? p.format + " : " : "") + (p.idee || ""));
      td1.style.whiteSpace = "nowrap";
      if (p.pilier) td2.appendChild(el("span", "pil " + (p.pilier === "Offre commerciale" ? "Offre" : p.pilier), p.pilier === "Offre commerciale" ? "Offre" : p.pilier));
      add(tr, td1, td2, td3); t.appendChild(tr);
    });
    box.appendChild(t);
    var b = el("div", "checks"); badges(analyseD(d), b); box.appendChild(b);
  }
  if (d.accroche || d.texte || d.cta) {
    add(box, el("div", "k", "Premier post"));
    var pb = el("div", "postbox");
    if (d.accroche) pb.appendChild(el("div", "acc", d.accroche));
    if (d.texte) pb.appendChild(el("div", null, d.texte));
    if (d.cta) pb.appendChild(el("div", "cta2", d.cta));
    box.appendChild(pb);
  }
}
var CARTES = { B: carteB, C: carteC, D: carteD };

function dessinerMur(liste, cible, compteur) {
  cible.textContent = "";
  compteur.textContent = liste.length + (liste.length > 1 ? " réponses" : " réponse");
  if (!liste.length) { cible.appendChild(el("div", "empty", "Aucune réponse pour l’instant. Les premières arrivent bientôt…")); return; }
  liste.forEach(function (r) {
    var box = el("div", "resp" + (r.moi ? " moi" : ""));
    if (r.moi) box.appendChild(el("span", "you", "Vous"));
    add(box, el("div", "who", r.nom || "Sans nom"));
    if (r.marque) box.appendChild(el("div", "brand", r.marque));
    try { CARTES[ATELIER](r.data || {}, box); } catch (e) { /* réponse incomplète : on affiche le reste */ }
    cible.appendChild(box);
  });
}

/* ---------- pages ---------- */
var minuterie = null;
function demarrerMur(cible, compteur, etat) {
  function charger() {
    run("mur", [ATELIER, (MUR || PROJ) ? "" : jeton(ATELIER)], function (l) { dessinerMur(l, cible, compteur); etat.textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); },
      function (m) { etat.textContent = "Connexion difficile, nouvel essai…"; });
  }
  charger();
  if (minuterie) clearInterval(minuterie);
  minuterie = setInterval(charger, (MUR || PROJ) ? 5000 : 8000);
}

function pageMur(root) {
  root.className = "wrap large";
  entete(root);
  var head = el("div", "wall-head"), cpt = el("span", "count", "…"), etat = el("span", "live", "Chargement…");
  head.style.marginTop = "20px";
  add(head, cpt, etat);
  var grid = el("div", "grid");
  add(root, head, grid);
  demarrerMur(grid, cpt, etat);
}

function pageAtelier(root) {
  entete(root);
  var tabs = el("div", "tabs"), t1 = el("button", "tab on", "Ma réponse"), t2 = el("button", "tab", "Le mur du groupe");
  add(tabs, t1, t2); root.appendChild(tabs);

  var vForm = el("div"), vMur = el("div", "hidden");
  add(root, vForm, vMur);

  var form = el("form"); form.noValidate = true;
  identite(form);
  FORMS[ATELIER][0](form);
  var btn = el("button", "btn", "Envoyer et voir le mur"); btn.type = "submit";
  var msg = el("div", "msg");
  add(form, btn, msg);
  vForm.appendChild(form);

  var head = el("div", "wall-head"), cpt = el("span", "count", "…"), etat = el("span", "live", "");
  var grid = el("div", "grid"), retour = el("button", "btn ghost", "Modifier ma réponse");
  add(vMur, head, grid, retour); add(head, cpt, etat);

  function montrer(mur) {
    t1.className = "tab" + (mur ? "" : " on"); t2.className = "tab" + (mur ? " on" : "");
    vForm.className = mur ? "hidden" : ""; vMur.className = mur ? "" : "hidden";
    if (mur) demarrerMur(grid, cpt, etat); else if (minuterie) { clearInterval(minuterie); minuterie = null; }
    window.scrollTo(0, 0);
  }
  t1.onclick = function () { montrer(false); };
  t2.onclick = function () { montrer(true); };
  retour.onclick = function () { montrer(false); };

  run("maReponse", [ATELIER, jeton(ATELIER)], function (d) {
    if (!d) return;
    setVal("nom", d.nom); setVal("marque", d.marque);
    FORMS[ATELIER][2](d);
  }, function () {});

  form.onsubmit = function (ev) {
    ev.preventDefault();
    msg.className = "msg";
    var nom = val("nom");
    if (!nom) { msg.className = "msg err"; msg.textContent = "Indiquez votre nom pour qu’il s’affiche sur le mur."; document.getElementById("nom").focus(); return; }
    var data = FORMS[ATELIER][1]();
    if (ATELIER === "D" && analyseD(data).offres > 1) { msg.className = "msg err"; msg.textContent = "Une seule offre commerciale sur les 6 publications : changez le pilier d’une des offres."; return; }
    data.nom = nom; data.marque = val("marque");
    store("nom", nom);
    btn.disabled = true; btn.textContent = "Envoi en cours…";
    run("envoyer", [ATELIER, jeton(ATELIER), data], function (liste) {
      btn.disabled = false; btn.textContent = "Envoyer et voir le mur";
      montrer(true);
      dessinerMur(liste, grid, cpt);
    }, function (m) {
      btn.disabled = false; btn.textContent = "Envoyer et voir le mur";
      msg.className = "msg err"; msg.textContent = "L’envoi n’a pas abouti (" + m + "). Vérifiez votre connexion et réessayez.";
    });
  };
}

function dessinerQR(texte) {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "QR code vers " + texte);
  if (typeof qrcode !== "function") { svg.setAttribute("viewBox", "0 0 10 10"); return svg; }
  var qr = qrcode(0, "M"); qr.addData(texte); qr.make();
  var n = qr.getModuleCount(), m = 2, size = n + 2 * m;
  svg.setAttribute("viewBox", "0 0 " + size + " " + size);
  svg.setAttribute("shape-rendering", "crispEdges");
  var bg = document.createElementNS(NS, "rect");
  bg.setAttribute("width", size); bg.setAttribute("height", size); bg.setAttribute("fill", "#FFFFFF");
  svg.appendChild(bg);
  var d = "";
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
  var path = document.createElementNS(NS, "path");
  path.setAttribute("d", d); path.setAttribute("fill", "#0A3642");
  svg.appendChild(path);
  return svg;
}

function pageProjection(root) {
  root.className = "wrap large";
  entete(root);
  var lien = BASE + "?atelier=" + ATELIER;
  var grille = el("div", "proj"), gauche = el("div", "qrbox"), droite = el("div");
  grille.style.marginTop = "24px";
  add(gauche, el("div", "go", "Scannez pour participer"), dessinerQR(lien),
      el("div", "url", location.host + "/ateliers"), el("div", "then", "ou tapez cette adresse, puis choisissez l’atelier " + ATELIER));
  var head = el("div", "wall-head"), cpt = el("span", "count", "…"), etat = el("span", "live", "Chargement…");
  add(head, cpt, etat);
  var grid = el("div", "grid");
  add(droite, head, grid);
  add(grille, gauche, droite);
  root.appendChild(grille);
  demarrerMur(grid, cpt, etat);
}

function agrandir() { document.documentElement.style.zoom = Math.max(1, Math.min(2.2, window.innerWidth / 1150)); }

/* Dans la présentation (iframe) : les flèches et l'espace restent à la présentation. */
if (window.parent !== window) {
  document.addEventListener("keydown", function (ev) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    try { window.parent.dispatchEvent(new KeyboardEvent("keydown", { key: ev.key, code: ev.code, bubbles: true })); ev.preventDefault(); } catch (e) {}
  });
}

(function () {
  var root = document.getElementById("app");
  if (!CONF[ATELIER]) menu(root);
  else if (PROJ) { agrandir(); window.addEventListener("resize", agrandir); pageProjection(root); }
  else if (MUR) { agrandir(); window.addEventListener("resize", agrandir); pageMur(root); }
  else pageAtelier(root);
})();
</script>
</body>
</html>
