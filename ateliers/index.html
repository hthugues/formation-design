<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ateliers en ligne - Identité visuelle &amp; Marketing digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --lagon: #0F4C5C; --lagon-deep: #0A3642; --lagon-soft: #C9DCE0;
    --ocre: #E3A23B; --ocre-ink: #8A5D0E; --sable: #FAF7F2; --gres: #E4DED3;
    --blanc: #FFFDF9; --ink: #2B2D2F; --soft: #5A5F62; --ok: #2E7D4F; --ko: #B42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sable); color: var(--ink); font-family: Inter, Arial, sans-serif; font-size: 17px; line-height: 1.45; }
  h1, h2, h3 { font-family: "Playfair Display", Georgia, serif; color: var(--lagon); margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 18px 80px; }
  .wrap.large { max-width: 1600px; }
  .back { display: inline-block; color: var(--lagon); font-weight: 700; text-decoration: none; font-size: 15px; margin-bottom: 14px; background: #fff; border: 2px solid var(--lagon-soft); border-radius: 30px; padding: 7px 16px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--ocre-ink); }
  .top h1 { font-size: 34px; line-height: 1.1; margin-top: 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pill { background: var(--lagon); color: var(--sable); border-radius: 30px; padding: 4px 14px; font-size: 13px; font-weight: 600; }
  .pill.ocre { background: var(--ocre); color: var(--lagon-deep); }
  .consigne { margin-top: 14px; color: var(--soft); }
  .tabs { display: flex; gap: 8px; margin: 22px 0 18px; border-bottom: 2px solid var(--gres); }
  .tab { background: none; border: none; padding: 10px 6px; margin-bottom: -2px; font: inherit; font-weight: 600; color: var(--soft); border-bottom: 3px solid transparent; cursor: pointer; }
  .tab.on { color: var(--lagon); border-bottom-color: var(--ocre); }
  .card { background: var(--blanc); border-top: 5px solid var(--lagon); padding: 18px; margin-bottom: 16px; border-radius: 6px; box-shadow: 0 1px 2px rgba(15,76,92,.06); }
  .card h3 { font-size: 21px; margin-bottom: 12px; }
  .card .num { font-family: "Playfair Display", Georgia, serif; color: var(--ocre-ink); font-weight: 700; margin-right: 6px; }
  label { display: block; font-weight: 600; font-size: 15px; margin: 12px 0 6px; }
  .hint { font-weight: 400; color: var(--soft); font-size: 14px; }
  input[type=text], textarea, select { width: 100%; font: inherit; padding: 11px 12px; border: 1.5px solid var(--gres); border-radius: 6px; background: #fff; color: var(--ink); }
  input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--lagon); box-shadow: 0 0 0 3px rgba(15,76,92,.15); }
  textarea { min-height: 90px; resize: vertical; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .color-row { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
  .color-row input[type=color] { width: 56px; height: 48px; border: 1.5px solid var(--gres); border-radius: 6px; padding: 2px; background: #fff; }
  .counter { text-align: right; font-size: 13px; color: var(--soft); margin-top: 4px; }
  .counter.over { color: var(--ko); font-weight: 600; }
  .post-row { border-top: 1px solid var(--gres); padding-top: 10px; margin-top: 10px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .check { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--gres); color: var(--ink); }
  .check.ok { background: #DFF0E5; color: var(--ok); }
  .check.ko { background: #FBE4E1; color: var(--ko); }
  .btn { display: inline-block; width: 100%; background: var(--lagon); color: var(--sable); border: none; border-radius: 40px; padding: 15px 20px; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; margin-top: 8px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.ghost { background: none; color: var(--lagon); border: 2px solid var(--lagon); }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 6px; display: none; }
  .msg.err { display: block; background: #FBE4E1; color: var(--ko); }
  .preview-phrase { margin-top: 14px; background: var(--sable); border-left: 4px solid var(--ocre); padding: 12px 14px; font-family: "Playfair Display", Georgia, serif; font-size: 19px; color: var(--lagon); }
  .preview-phrase .vide { color: #A6A9AB; }
  .preview-phrase b { color: var(--ocre-ink); }
  .upload { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; margin-top: 10px; }
  .upload .thumb { width: 84px; height: 84px; border-radius: 8px; background: var(--gres) center / cover no-repeat; border: 1.5px dashed #B9B2A6; }
  .upload .thumb.round { border-radius: 50%; }
  .upload .thumb.wide { width: 84px; height: 48px; }
  .upload input[type=file] { font-size: 14px; }
  .menu a { display: block; text-decoration: none; background: var(--blanc); border-top: 5px solid var(--lagon); padding: 20px; margin-bottom: 14px; border-radius: 6px; color: var(--ink); }
  .menu a h2 { font-size: 24px; }
  .menu a p { margin: 6px 0 0; color: var(--soft); }
  /* Accueil des ateliers */
  .hero { background: var(--lagon); color: var(--sable); border-radius: 18px; padding: 26px 24px 22px; margin-bottom: 26px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: var(--ocre); opacity: .9; }
  .hero > * { position: relative; z-index: 1; }
  .hero .eyebrow { color: var(--ocre); }
  .hero h1 { color: #fff; font-size: 36px; margin-top: 6px; max-width: 75%; }
  .hero p { margin: 10px 0 0; color: #D6E8EC; max-width: 560px; }
  .prog { margin-top: 18px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; }
  .prog .barre { flex: 1; height: 10px; border-radius: 10px; background: rgba(255,255,255,.18); overflow: hidden; }
  .prog .barre i { display: block; height: 100%; background: var(--ocre); border-radius: 10px; }
  .sec { margin-bottom: 30px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 3px solid var(--ocre); padding-bottom: 8px; margin-bottom: 14px; }
  .sec-head h2 { font-size: 25px; }
  .sec-sub { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ocre-ink); white-space: nowrap; }
  .sec-note { margin: -4px 0 14px; color: var(--soft); font-size: 15px; }
  .tuile { display: grid; grid-template-columns: 56px 1fr; gap: 16px; background: #fff; border: 1.5px solid var(--gres); border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(15,76,92,.07); }
  .tuile .badge { width: 52px; height: 52px; border-radius: 50%; background: var(--lagon); color: #fff; display: flex; align-items: center; justify-content: center; font-family: "Playfair Display", Georgia, serif; font-size: 24px; font-weight: 700; }
  .tuile.fait { border-color: #BFDCC9; background: #F6FBF7; }
  .tuile.fait .badge { background: var(--ok); }
  .tuile.ocre .badge { background: var(--ocre); color: var(--lagon-deep); }
  .tuile .ligne1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tuile .duree { background: var(--lagon-soft); color: var(--lagon-deep); border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .tuile .etat { margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: var(--gres); color: var(--soft); }
  .tuile.fait .etat { background: #DFF0E5; color: var(--ok); }
  .tuile h3 { font-size: 22px; margin-top: 6px; }
  .tuile p { margin: 6px 0 0; color: var(--soft); font-size: 15px; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .cta { display: inline-block; background: var(--ocre); color: var(--lagon-deep); text-decoration: none; font-weight: 700; font-size: 17px; padding: 13px 24px; border-radius: 40px; box-shadow: 0 3px 0 #B97F22; }
  .cta:active { transform: translateY(2px); box-shadow: 0 1px 0 #B97F22; }
  .tuile.fait .cta { background: #fff; color: var(--lagon); border: 2px solid var(--lagon); box-shadow: none; padding: 11px 22px; }
  .cta2 { display: inline-block; color: var(--lagon); text-decoration: none; font-weight: 700; font-size: 15px; padding: 13px 16px; border-radius: 40px; border: 2px solid var(--lagon-soft); }
  @media (max-width: 520px) { .tuile { grid-template-columns: 1fr; } .tuile .badge { width: 44px; height: 44px; font-size: 20px; } .cta { width: 100%; text-align: center; } .cta2 { width: 100%; text-align: center; } .hero h1 { font-size: 30px; } }
  /* Sections des formulaires */
  .card { border: 1.5px solid var(--gres); border-top: 5px solid var(--lagon); border-radius: 14px; padding: 20px 18px; box-shadow: 0 2px 8px rgba(15,76,92,.07); background: #fff; }
  .card h3 { display: flex; align-items: center; gap: 10px; font-size: 22px; padding-bottom: 10px; border-bottom: 1px solid var(--gres); margin-bottom: 6px; }
  .card .num { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ocre); color: var(--lagon-deep); font-size: 18px; margin-right: 0; flex-shrink: 0; }
  form .btn[type=submit] { background: var(--ocre); color: var(--lagon-deep); font-size: 19px; padding: 17px 20px; box-shadow: 0 4px 0 #B97F22; }
  /* Mur */
  .wall-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .wall-head .count { font-weight: 700; color: var(--lagon); }
  .wall-head .live { font-size: 13px; color: var(--soft); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .large .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .resp { position: relative; background: var(--blanc); border-radius: 8px; padding: 18px; border-top: 5px solid var(--lagon); box-shadow: 0 1px 3px rgba(15,76,92,.08); }
  .resp.moi { border-top-color: var(--ocre); box-shadow: 0 0 0 2px var(--ocre); }
  .resp .who { font-family: "Playfair Display", Georgia, serif; font-size: 22px; font-weight: 700; color: var(--lagon); padding-right: 96px; }
  .resp .brand { color: var(--ocre-ink); font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .resp .tools { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; align-items: center; }
  .resp .you { background: var(--ocre); color: var(--lagon-deep); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .zoom-btn { background: var(--blanc); color: var(--lagon); border: 1.5px solid var(--lagon); border-radius: 20px; font: inherit; font-size: 12px; font-weight: 700; padding: 3px 10px; cursor: pointer; }
  .resp .k { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--soft); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--gres); border-radius: 20px; padding: 3px 12px; font-size: 14px; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sw .box { height: 56px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .sw .nm { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .sw .hx { font-size: 12px; color: var(--soft); }
  .fonts .f1 { font-size: 20px; font-weight: 700; color: var(--lagon); }
  .phrase { font-family: "Playfair Display", Georgia, serif; font-size: 19px; line-height: 1.4; color: var(--lagon); margin-top: 10px; }
  .phrase b { color: var(--ocre-ink); }
  .quote { margin-top: 10px; font-size: 15px; }
  .plan { width: 100%; border-collapse: collapse; font-size: 14px; }
  .plan td { padding: 6px 4px; border-top: 1px solid var(--gres); vertical-align: top; }
  .plan .pil { font-size: 12px; font-weight: 700; border-radius: 12px; padding: 2px 8px; white-space: nowrap; display: inline-block; }
  .pil.Montrer { background: #DCEBEE; color: var(--lagon-deep); }
  .pil.Apprendre { background: #E8E2F4; color: #4A3A78; }
  .pil.Coulisses { background: #F3E6CF; color: var(--ocre-ink); }
  .pil.Preuve { background: #DFF0E5; color: var(--ok); }
  .pil.Offre { background: #FBE4E1; color: var(--ko); }
  .postbox { background: var(--sable); border-left: 4px solid var(--ocre); padding: 10px 12px; margin-top: 8px; font-size: 14px; }
  .postbox .acc { font-weight: 700; }
  .postbox .cta2 { font-weight: 600; color: var(--lagon); margin-top: 6px; }
  .empty { text-align: center; color: var(--soft); padding: 40px 10px; }
  .large .top h1 { font-size: 44px; }
  .hidden { display: none !important; }
  /* Profils par canal */
  .pf { margin-top: 12px; border-radius: 14px; overflow: hidden; border: 1px solid #DADDE1; background: #fff; font-family: Arial, Helvetica, sans-serif; color: #1C1E21; }
  .pf .cover { height: 110px; background: #CFD8DC center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px; text-align: center; padding: 6px; }
  .pf .av { width: 76px; height: 76px; border-radius: 50%; background: #B0BEC5 center / cover no-repeat; border: 4px solid #fff; flex-shrink: 0; }
  .pf .nm { font-weight: 700; font-size: 18px; }
  .pf .sub { color: #65676B; font-size: 13px; }
  .pf .bio { font-size: 14px; margin-top: 6px; white-space: pre-line; }
  .pf .info { font-size: 13px; color: #65676B; margin-top: 6px; }
  .pf .act { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pf .act span { flex: 1; text-align: center; border-radius: 8px; padding: 7px 8px; font-size: 13px; font-weight: 700; background: #E4E6EB; color: #1C1E21; }
  .pf .posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 10px; }
  .pf .posts div { aspect-ratio: 1; background: #ECEFF1 center / cover no-repeat; }
  .pf .body { padding: 10px 14px 14px; }
  .pf-fb .head { display: flex; align-items: flex-end; gap: 10px; margin-top: -38px; }
  .pf-fb .act span.main { background: #1877F2; color: #fff; }
  .pf-gg { font-family: Arial, sans-serif; }
  .pf-gg .cover { height: 130px; }
  .pf-gg .nm { font-size: 20px; font-weight: 400; }
  .pf-gg .act span { background: #fff; border: 1px solid #DADCE0; color: #1A73E8; border-radius: 18px; }
  .pf-gg .act span.main { background: #1A73E8; color: #fff; border-color: #1A73E8; }
  .pf-gg .tag { display: inline-block; font-size: 11px; font-weight: 700; color: #1A73E8; letter-spacing: .5px; margin-bottom: 4px; }
  .pf-wa .bar { background: #075E54; color: #fff; font-size: 13px; font-weight: 700; padding: 8px 12px; }
  .pf-wa .center { text-align: center; padding: 14px 14px 0; }
  .pf-wa .av { width: 96px; height: 96px; margin: 0 auto; border-color: #fff; }
  .pf-wa .badge { color: #008069; font-size: 12px; font-weight: 700; }
  .pf-wa .act span.main { background: #25D366; color: #fff; }
  .pf-wa .cat { font-size: 12px; font-weight: 700; color: #008069; margin-top: 10px; }
  .pf-ig .head { display: flex; align-items: center; gap: 16px; padding: 14px 14px 0; }
  .pf-ig .ring { padding: 3px; border-radius: 50%; background: linear-gradient(45deg, #F9CE34, #EE2A7B, #6228D7); }
  .pf-ig .av { border-width: 3px; }
  .pf-ig .stats { display: flex; gap: 16px; font-size: 13px; text-align: center; }
  .pf-ig .stats b { display: block; font-size: 16px; }
  .pf-ig .act span.main { background: #0095F6; color: #fff; }
  .pf-tt { background: #121212; color: #fff; border-color: #333; }
  .pf-tt .center { text-align: center; padding: 16px 14px 0; }
  .pf-tt .av { width: 92px; height: 92px; margin: 0 auto; border-color: #121212; }
  .pf-tt .sub, .pf-tt .info { color: #A8A8A8; }
  .pf-tt .act span { background: #2F2F2F; color: #fff; }
  .pf-tt .act span.main { background: #FE2C55; }
  .pf-tt .posts div { aspect-ratio: 3 / 4; background-color: #2A2A2A; }
  .pf .desc { font-size: 12px; color: #8A8D91; margin-top: 6px; }
  /* Agrandir */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(10, 54, 66, .78); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal .box { position: relative; background: var(--sable); border-radius: 14px; width: min(1100px, 100%); max-height: 100%; overflow-y: auto; padding: 28px 32px; }
  .modal .resp { box-shadow: none; font-size: 22px; padding: 0; background: none; border: none; }
  .modal .resp .who { font-size: 40px; padding-right: 0; }
  .modal .resp .brand { font-size: 18px; }
  .modal .resp .k { font-size: 15px; }
  .modal .chip { font-size: 20px; padding: 5px 16px; }
  .modal .sw .box { height: 110px; }
  .modal .sw .nm { font-size: 18px; }
  .modal .fonts .f1 { font-size: 34px; }
  .modal .phrase { font-size: 34px; }
  .modal .plan { font-size: 20px; }
  .modal .postbox { font-size: 21px; }
  .modal .pf { max-width: 560px; margin-left: auto; margin-right: auto; font-size: 18px; }
  .modal .tools, .modal .zoom-btn { display: none; }
  .modal .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .modal .nav button { background: var(--lagon); color: #fff; border: none; border-radius: 30px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  .modal .nav .pos { color: var(--soft); font-weight: 600; }
  @media (max-width: 480px) { .row3 { grid-template-columns: 1fr; } .post-row .row3 { grid-template-columns: 1fr 1fr; } .modal { padding: 8px; } .modal .box { padding: 18px; } }
</style>

<script>

var ORDRE = ["P", "A", "B", "C", "D"];

/* ---------- petits outils ---------- */
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function jeton() {
  var k = "jeton_participant", t = store(k);
  if (!t) { var a = new Uint8Array(16); crypto.getRandomValues(a); t = Array.prototype.map.call(a, function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); store(k, t); }
  return t;
}
function input(id, ph, max) { var i = el("input"); i.type = "text"; i.id = id; if (ph) i.placeholder = ph; i.maxLength = max || 120; return i; }
function area(id, ph, max) { var t = el("textarea"); t.id = id; if (ph) t.placeholder = ph; t.maxLength = max || 600; return t; }
function select(id, options, first) {
  var s = el("select"); s.id = id;
  if (first) { var o = el("option", null, first); o.value = ""; s.appendChild(o); }
  options.forEach(function (v) { var o = el("option", null, v); o.value = v; s.appendChild(o); });
  return s;

var CARTES = { P: carteP, A: carteA, B: carteB, C: carteC, D: carteD };

function construireCarte(r, liste, i) {

  var tools = el("div", "tools");
  if (r.moi) tools.appendChild(el("span", "you", "Vous"));
  var z = el("button", "zoom-btn", "Agrandir"); z.type = "button"; z.onclick = function () { ouvrirModal(liste, i); };
  tools.appendChild(z); box.appendChild(tools);
  add(box, el("div", "who", r.nom || "Sans nom"));
  if (r.marque) box.appendChild(el("div", "brand", r.marque));
  try { CARTES[ATELIER](r.data || {}, box, r); } catch (e) { /* réponse incomplète */ }
  return box;
}

/* ---------- Agrandir : une réponse à la fois ---------- */
var MODAL = null;
function ouvrirModal(liste, i) {
  fermerModal();
  var m = el("div", "modal"), box = el("div", "box"), nav = el("div", "nav"), prev = el("button", null, "← Précédente"), pos = el("span", "pos"), next = el("button", null, "Suivante →"), close = el("button", null, "Fermer ✕");
  var zone = el("div"), idx = i;
  function montrer() {
    zone.textContent = ""; pos.textContent = (idx + 1) + " / " + liste.length;
    zone.appendChild(construireCarte(liste[idx], liste, idx));
    prev.disabled = idx === 0; next.disabled = idx === liste.length - 1;
    prev.style.opacity = prev.disabled ? ".35" : "1"; next.style.opacity = next.disabled ? ".35" : "1";
  }
  prev.onclick = function () { if (idx > 0) { idx--; montrer(); } };
  next.onclick = function () { if (idx < liste.length - 1) { idx++; montrer(); } };
  close.onclick = fermerModal;

function fermerModal() { if (MODAL) { MODAL.el.remove(); MODAL = null; } }
document.addEventListener("keydown", function (ev) {
  if (MODAL) {

/* ---------- pages ---------- */

}
function dessinerQR(texte) {
  var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");

}
