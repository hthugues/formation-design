<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EAD3"/><stop offset=".55" stop-color="#EBD3A8"/><stop offset="1" stop-color="#D9B57C"/>
    </linearGradient>
    <radialGradient id="lumiere" cx=".72" cy=".28" r=".7">
      <stop offset="0" stop-color="#FFF6E0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gousse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3418"/><stop offset=".45" stop-color="#3A1F0E"/><stop offset="1" stop-color="#22120A"/>
    </linearGradient>
    <linearGradient id="petale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6D8"/><stop offset="1" stop-color="#E4E39A"/>
    </linearGradient>
    <linearGradient id="feuille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FA25B"/><stop offset="1" stop-color="#3F6B34"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="9" flood-color="#5A3418" flood-opacity=".35"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".7" fill="#8A5D0E" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#fond)"/>
  <rect width="800" height="800" fill="url(#lumiere)"/>
  <rect width="800" height="800" fill="url(#grain)"/>

  <!-- feuilles -->
  <g filter="url(#ombre)">
    <path d="M610 120 C700 140 760 230 740 330 C660 300 600 230 610 120 Z" fill="url(#feuille)"/>
    <path d="M612 124 C660 190 700 250 738 326" stroke="#2F5427" stroke-width="3" fill="none" opacity=".6"/>
    <path d="M90 640 C40 560 60 470 140 430 C170 510 160 590 90 640 Z" fill="url(#feuille)"/>
  </g>

  <!-- gousses de vanille -->
  <g filter="url(#ombre)">
    <g transform="rotate(-24 400 470)">
      <path d="M120 470 C260 446 520 444 690 462 C700 464 702 476 690 478 C520 494 260 494 120 482 C108 480 108 472 120 470 Z" fill="url(#gousse)"/>
      <path d="M150 466 C300 454 500 452 660 462" stroke="#8A5A2E" stroke-width="2.4" fill="none" opacity=".7"/>
    </g>
    <g transform="rotate(-16 410 530)">
      <path d="M140 530 C280 508 540 506 700 522 C712 524 712 536 700 538 C540 554 280 556 140 542 C128 540 128 532 140 530 Z" fill="url(#gousse)"/>
      <path d="M170 526 C320 514 520 512 670 522" stroke="#8A5A2E" stroke-width="2.4" fill="none" opacity=".7"/>
    </g>
    <g transform="rotate(-8 420 590)">
      <path d="M160 590 C300 570 560 568 710 582 C722 584 722 596 710 598 C560 614 300 616 160 602 C148 600 148 592 160 590 Z" fill="url(#gousse)"/>
      <path d="M190 586 C340 574 540 572 680 582" stroke="#8A5A2E" stroke-width="2.4" fill="none" opacity=".7"/>
    </g>
    <!-- lien de raphia -->
    <g transform="rotate(-16 410 530)">
      <rect x="392" y="440" width="22" height="190" rx="6" fill="#D8B26A"/>
      <rect x="396" y="440" width="5" height="190" fill="#F0D79A" opacity=".7"/>
    </g>
  </g>

  <!-- fleur de vanille (orchidée) -->
  <g transform="translate(560 250)" filter="url(#ombre)">
    <g fill="url(#petale)" stroke="#D9D08A" stroke-width="1.5">
      <ellipse cx="0" cy="-70" rx="22" ry="66"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(72)"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(144)"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(216)"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(288)"/>
    </g>
    <path d="M-30 6 C-34 -30 34 -30 30 6 C26 44 -26 44 -30 6 Z" fill="#F7EFB0" stroke="#D2C46E" stroke-width="2"/>
    <path d="M-16 10 C-10 22 10 22 16 10" stroke="#E3A23B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="7" fill="#E3C25A"/>
  </g>
  <g transform="translate(250 200) scale(.55)" opacity=".9">
    <g fill="url(#petale)" stroke="#D9D08A" stroke-width="2">
      <ellipse cx="0" cy="-70" rx="22" ry="66"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(72)"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(144)"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(216)"/>
      <ellipse cx="0" cy="-70" rx="22" ry="66" transform="rotate(288)"/>
    </g>
    <path d="M-30 6 C-34 -30 34 -30 30 6 C26 44 -26 44 -30 6 Z" fill="#F7EFB0"/>
    <circle cx="0" cy="-6" r="7" fill="#E3C25A"/>
  </g>

  <!-- graines -->
  <g fill="#2A170B" opacity=".55">
    <circle cx="250" cy="700" r="2.2"/><circle cx="262" cy="708" r="1.6"/><circle cx="240" cy="712" r="1.8"/>
    <circle cx="560" cy="690" r="2"/><circle cx="574" cy="684" r="1.5"/><circle cx="548" cy="702" r="1.7"/>
  </g>
</svg>
