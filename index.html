, écran retourné, et de vérifier qu'il a du réseau ou du Wi-Fi.\n\nÀ DIRE\n« Bonjour à toutes et à tous, et bienvenue au B-Lossom Center. Je m'appelle Hugues Hamba et je vais vous accompagner pendant deux heures sur un sujet qui fait la différence pour tous vos projets : votre image de marque. Gardez votre téléphone à portée de main, il va devenir un outil de travail tout à l'heure. »"},{n:2,part:1,layout:"content",title:"2 heures, 2 moitiés",screen:["1 · Construire ma marque","2 · La faire vivre en ligne","4 ateliers, dont 3 en ligne"],notes:"MINUTAGE : 0:01 - 0:02\n\nÀ DIRE\n« Le programme tient en deux moitiés. D'abord, on construit votre marque : ce qu'elle dit et à quoi elle ressemble. Ensuite, on la fait vivre en ligne. Publier sans identité, c'est parler fort sans qu'on sache qui parle. Avoir une belle identité sans la diffuser, c'est une vitrine dans une rue vide. Aujourd'hui, on fait les deux. »\n\nÀ FAIRE\n- Annoncez 4 ateliers, dont 3 en ligne sur téléphone, et pas de pause : « on enchaîne, alors levez-vous ou servez-vous un verre d'eau quand vous en avez besoin ».",visual:"halves",arrangement:"visual"},{n:3,part:1,layout:"content",title:"La marque que vous suivez en ligne",screen:["Prénom","Projet","Une marque que vous suivez sur Facebook, Instagram ou TikTok, et pourquoi"],notes:"MINUTAGE : 0:02 - 0:06\n\nÀ FAIRE\n- Tour de table : 20 secondes par personne. Au-delà de 15 participants, faites-le par table, puis demandez 3 exemples en plénière.\n- Notez au paperboard les raisons citées (« belles photos », « ils répondent vite », « toujours le même style »).\n\nÀ DIRE\n« Présentez-vous en trois choses : votre prénom, votre projet en une phrase, et une marque que vous suivez en ligne. Dites-nous surtout pourquoi vous la suivez. »\n\nCONCLUSION\n« Regardez ce que vous avez cité : la régularité, le style, la réactivité. C'est exactement le programme de ce matin. »",visual:"question",arrangement:"split"},{n:4,part:1,layout:"section",module:"01",title:"Les fondations de la marque",screen:[],notes:"MINUTAGE : 0:06\n\nÀ FAIRE\n- Marquez une courte pause : une slide de transition sert à respirer.\n\nÀ DIRE\n« Premier module : les fondations. Avant de parler de couleurs ou de logo, il faut savoir ce que l'on veut dire. »"},{n:5,part:1,layout:"content",kicker:"Module 1",title:"Logo, identité, marque",screen:["Logo = la signature","Identité visuelle = la tenue complète","Marque = la réputation","Une identité = un visage unique"],notes:"MINUTAGE : 0:06 - 0:08\n\nÀ DIRE\n« On confond souvent trois mots. Le logo, c'est votre signature : la petite partie visible. L'identité visuelle, c'est votre tenue complète : couleurs, polices, images, ton. Et la marque, c'est votre réputation, ce que les gens disent de vous quand vous n'êtes pas là. En ligne, c'est littéral : commentaires, avis Google, partages. Votre identité est comme un visage : unique, elle montre une personnalité et devient votre signature. »\n\nPIÈGE À ÉVITER\n- Ne pas dénigrer ceux qui n'ont qu'un logo : c'est un bon début.",visual:"iceberg",arrangement:"split"},{n:6,part:1,layout:"content",kicker:"Module 1",title:"Les 3 piliers",screen:["Cible : pour qui ?","Valeurs : en quoi je crois ?","Positionnement : pourquoi moi ?"],notes:"MINUTAGE : 0:08 - 0:10\n\nÀ DIRE\n« Toute marque tient sur trois piliers : pour qui je travaille, en quoi je crois, et pourquoi on me choisirait plutôt qu'un autre. Prenez deux établissements de Nosy Be : un écolodge pour couples en quête de calme et un bar de plage pour les jeunes du week-end. Même île, même soleil, mais deux identités et deux façons de communiquer opposées. »\n\nQUESTION AU GROUPE\n« Qui peut me décrire sa cible en une phrase ? » Laissez 2 réponses. Si quelqu'un dit « tout le monde », reprenez gentiment : tout le monde, c'est personne.",visual:"temple",arrangement:"split"},{n:7,part:1,layout:"content",kicker:"Module 1",title:"La phrase de positionnement",screen:["Pour [cible] qui [besoin], [marque] est [catégorie] qui [bénéfice unique], grâce à [preuve]."],notes:"MINUTAGE : 0:10 - 0:13\n\nÀ DIRE\n« Voici l'outil le plus utile de la matinée : la phrase de positionnement. Pour [cible] qui [besoin], [marque] est [catégorie] qui [bénéfice unique], grâce à [preuve]. Exemple : pour les voyageurs qui veulent rapporter un vrai goût de Madagascar, Épices du Nord est l'épicerie artisanale qui garantit l'origine de chaque produit, grâce à des achats directs aux producteurs. »\n\nINSISTEZ\n- Sans preuve, c'est un slogan.\n- Cette phrase deviendra la bio de votre page en ligne, dans la deuxième partie.",visual:"formula",arrangement:"visual"},{n:8,part:1,layout:"workshop",workshop:"A",title:"Atelier A · Ma phrase en une ligne",screen:["5 min seul","5 min en binôme","Le test : votre voisin peut-il la répéter ?"],notes:"MINUTAGE : 0:13 - 0:23 (10 min, papier)\n\nÀ FAIRE\n- Lancez le minuteur de la slide.\n- 5 min seul, puis 5 min en binôme avec un voisin d'une autre table.\n- Circulez. Pour débloquer quelqu'un : « Qu'est-ce que vos clients vous disent quand ils sont contents ? »\n\nDÉBRIEFING (2 min)\n- Faites lire 2 ou 3 phrases à voix haute.\n- 3 questions : la cible est-elle précise ? le bénéfice est-il différent des concurrents ? la preuve est-elle vérifiable ?\n- « Gardez précieusement cette phrase : vous allez la saisir en ligne dans un instant. »",visual:"pencil"},{n:9,part:1,layout:"section",module:"02",title:"Logo, couleurs, polices, images",screen:[],notes:"MINUTAGE : 0:23\n\nÀ DIRE\n« Vous savez maintenant ce que vous voulez dire. Voyons comment le dire sans un mot. »"},{n:10,part:1,layout:"content",kicker:"Module 2",title:"Décode cette marque",screen:["Que voyez-vous ?","Que ressentez-vous ?","À qui ça parle ?"],notes:"MINUTAGE : 0:23 - 0:26\n\nÀ FAIRE\n- Projetez 2 logos connus (par exemple Coca-Cola et Apple), puis 1 logo local si possible, sans le critiquer.\n\nÀ DIRE\n« Regardez ce logo trois secondes. Que voyez-vous ? Que ressentez-vous ? À qui parle-t-il ? »\n\nÀ RETENIR\n- Relevez les adjectifs au paperboard : des personnes différentes donnent souvent les mêmes. C'est la preuve que le visuel communique.",visual:"decode",arrangement:"visual"},{n:11,part:1,layout:"content",kicker:"Module 2",title:"Un logo qui marche aussi en icône",screen:["Simple","Mémorable","Lisible en 40 pixels","Beau en noir et blanc","Logo combiné : symbole + nom"],notes:"MINUTAGE : 0:26 - 0:28\n\nÀ DIRE\n« Aujourd'hui, votre logo vit surtout dans un petit rond : la photo de profil Facebook, WhatsApp ou Google Maps. Faites glisser le curseur : s'il n'est plus lisible en tout petit, il est trop compliqué. Prévoyez toujours une version carrée simplifiée. »\n\nCONSEIL\n- Pour une petite structure, un logo combiné, symbole et nom. Un symbole seul ne marche que si des millions de gens connaissent déjà votre nom.",visual:"logoScaler",arrangement:"visual"},{n:12,part:1,layout:"content",kicker:"Module 2",title:"Nommer ses couleurs",screen:["L’œil voit des millions de couleurs","Un code les rend uniques","HEX : #0F4C5C","RVB : (15 ; 76 ; 92)"],notes:"MINUTAGE : 0:28 - 0:30\n\nQUESTION AU GROUPE\n« Ces deux jaunes sont-ils identiques ? » Laissez répondre, puis révélez : non.\n\nÀ DIRE\n« Dire \"mon bleu\" ne suffit pas. L'imprimeur, le graphiste ou Canva ont besoin du code exact, par exemple #0F4C5C. Sans code, votre couleur change d'un support à l'autre et votre marque perd sa cohérence. »",visual:"colorCodes",arrangement:"visual"},{n:13,part:1,layout:"content",kicker:"Module 2",title:"Le cercle chromatique",screen:["Voisines : harmonie douce","Opposées : contraste fort","1 dominante + 1 accent"],notes:"MINUTAGE : 0:30 - 0:32\n\nÀ FAIRE\n- Cliquez sur une couleur du cercle pour montrer ses voisines et son opposée.\n\nÀ DIRE\n« Deux couleurs voisines donnent une harmonie douce, calme. Deux couleurs opposées créent du contraste et de l'énergie : parfaites pour la couleur d'accent. La règle simple : une couleur dominante, un accent. Coolors ou Adobe Color font ce travail gratuitement. »",visual:"colorWheel",arrangement:"visual"},{n:14,part:1,layout:"content",kicker:"Module 2",title:"60-30-10 et contraste",screen:["60 % neutre","30 % principale","10 % accent","Texte foncé sur fond clair"],notes:"MINUTAGE : 0:32 - 0:34\n\nÀ DIRE\n« La règle 60-30-10 : 60 % de couleur neutre, 30 % de couleur principale, 10 % d'accent pour ce qui compte. Ce diaporama applique exactement cette règle. »\n\nQUESTION AU GROUPE\n« Lequel des deux se lit le mieux de loin ? » Le contraste sert à faire sortir l'essentiel, pas à décorer.\n\nOUVERTURE\n« À Madagascar, quelle couleur évoque pour vous le sérieux ? Et la fête ? » Le sens des couleurs dépend aussi de la culture.",visual:"rule603010",arrangement:"visual"},{n:15,part:1,layout:"content",kicker:"Module 2",title:"Polices et fontes",screen:["Serif = avec empattements","Police = la famille","Fonte = un membre (Light, Regular, Bold)","2 familles maximum","Variez les graisses"],notes:"MINUTAGE : 0:34 - 0:35\n\nÀ DIRE\n« La typographie, c'est l'art de former et d'espacer les lettres. Une police, c'est une famille ; une fonte, c'est un membre de la famille : Light, Regular, Bold. Avec une seule famille bien déclinée, on fait déjà beaucoup. Retenez : 2 familles maximum, une pour les titres, une pour le texte. »\n\nAVEC HUMOUR\n- « Et une seule interdiction absolue : le Comic Sans. »",visual:"fonts",arrangement:"visual"},{n:16,part:1,layout:"content",kicker:"Module 2",title:"Composer : laisser respirer",screen:["Gommez le superflu","Alignez","Égalisez les espaces","Laissez des marges","Faites sortir l’essentiel"],notes:"MINUTAGE : 0:35 - 0:36\n\nÀ FAIRE\n- Basculez sur Avant, puis Après.\n\nÀ DIRE\n« Même information, deux flyers. À gauche, tout crie, donc plus rien ne se voit. À droite, on a gommé le superflu, aligné, laissé respirer. Le vide n'est pas du gaspillage : il guide l'œil. Ces règles valent pour chacune de vos publications. »\n\nTRANSITION\n« Vous avez tous les ingrédients. Place à votre charte. »",visual:"flyer",arrangement:"visual"},{n:17,part:1,layout:"workshop",workshop:"B",title:"Atelier B · Ma mini-charte express",screen:["1 page","3 couleurs nommées","2 polices","3 mots d’ambiance","Mon ton : je suis… mais pas…"],notes:"MINUTAGE : 0:36 - 0:49 (13 min, EN LIGNE)\n\nÀ FAIRE AVANT DE LANCER\n- Dans un autre onglet, ouvrez : votre-site/ateliers?atelier=B&projection=1\n  Il affiche en grand le QR code à scanner et le mur des réponses, qui se met à jour tout seul.\n- Passez d'un onglet à l'autre (Alt + Tab) pour revenir à la présentation.\n\nCONSIGNE À DIRE\n« Prenez votre téléphone et scannez le QR code. Choisissez l'atelier B et écrivez votre nom : il s'affichera sur le mur. Remplissez les 5 cases : 3 mots d'ambiance, 3 couleurs avec leur nom, 2 polices, votre style d'images en 3 mots, et votre ton, \"je suis… mais pas…\". Appuyez sur Envoyer : vous verrez aussitôt votre charte à côté de celles du groupe. »\n\nPENDANT L'ATELIER\n- Lancez le minuteur. Annoncez le temps restant à 7 min puis à 2 min.\n- Aidez ceux qui n'ont pas de réseau : ils peuvent travailler à deux sur un téléphone, en indiquant les deux noms.\n- Relancez : « Votre palette doit pouvoir se défendre avec votre phrase de positionnement. »\n\nDÉBRIEFING (3 min, sur le mur projeté)\n- Choisissez 2 chartes réussies : faites deviner au groupe les 3 mots d'ambiance avant de les lire.\n- Vérifiez le contraste : le nom se lirait-il à 2 mètres ?\n- « Une charte ne sert que si elle est répétée. Répétition, répétition, répétition : c'est ce qui vous rend identifiable. »",visual:"charteTemplate"}],VS=[{n:18,part:2,layout:"section",module:"03",title:"De la marque au digital",screen:[],notes:"MINUTAGE : 0:49 (pas de pause, on enchaîne)\n\nÀ DIRE\n« Deuxième moitié. Votre marque a maintenant un visage. On va lui ouvrir une vitrine qui reste allumée 24 heures sur 24, dans la poche de vos clients. »\n\nÀ FAIRE\n- Le changement de couleur, de bleu à ocre, marque le passage au digital. Laissez 2 secondes de silence."},{n:19,part:2,layout:"content",kicker:"Module 3",title:"Le parcours de votre client en ligne",screen:["Découvrir","S’intéresser","Contacter","Acheter","Recommander"],notes:"MINUTAGE : 0:49 - 0:52\n\nÀ FAIRE\n- Révélez les étapes une par une au clic.\n\nÀ DIRE\n« Suivons un touriste. Il voit une vidéo de coucher de soleil : il découvre. Il visite votre page : il s'intéresse. Il vous écrit sur WhatsApp : il contacte. Il réserve : il achète. Et il laisse un avis Google : il recommande. »\n\nQUESTION AU GROUPE\n« À quelle étape perdez-vous le plus de clients ? » La réponse oriente toute votre stratégie.",visual:"journey",arrangement:"visual"},{n:20,part:2,layout:"content",kicker:"Module 3",title:"Possédé, gagné, payé",screen:["Possédé : ma page, mon WhatsApp, mon site","Gagné : avis, partages, bouche-à-oreille","Payé : publicité, posts boostés"],notes:"MINUTAGE : 0:52 - 0:54\n\nÀ DIRE\n« Il existe trois types de visibilité. Le possédé : votre page, votre WhatsApp, votre site, gratuits et sous votre contrôle. Le gagné : les avis, les partages, le bouche-à-oreille, qu'il faut demander. Et le payé : la publicité, qui amplifie ce qui marche déjà. »\n\nÀ RETENIR\n- « Payer pour une page vide, c'est payer pour rien. »",visual:"owned",arrangement:"split"},{n:21,part:2,layout:"content",kicker:"Module 3",title:"2 canaux bien tenus valent mieux que 6 abandonnés",screen:["Facebook : large public local","WhatsApp Business : conversation et vente","Instagram : tourisme, image","TikTok : jeunes, vidéo","Google Business Profile : être trouvé sur Maps"],notes:"MINUTAGE : 0:54 - 0:56\n\nQUESTION AU GROUPE\n« Où se trouve votre cible ? » Vote à main levée canal par canal.\n\nÀ DIRE\n« Inutile d'être partout. Deux canaux bien tenus valent mieux que six abandonnés. Ma recommandation par défaut : WhatsApp Business pour la conversation et la vente, et une fiche Google Business Profile pour être trouvé sur Maps. Elle est gratuite et c'est là que les visiteurs de Nosy Be cherchent. Ensuite, un réseau principal selon votre cible. »",visual:"channels",arrangement:"visual"},{n:22,part:2,layout:"content",kicker:"Module 3",title:"Un profil cohérent en 6 points",screen:["Photo = logo carré","Bannière aux couleurs","Bio = phrase de positionnement","Même nom partout","Coordonnées à jour","Bouton d’action"],notes:"MINUTAGE : 0:56 - 0:59\n\nÀ FAIRE\n- Cliquez sur chaque zone du téléphone.\n\nÀ DIRE\n« Voici où les deux moitiés de la formation se rejoignent : votre charte habille votre profil. Photo égale logo carré, bannière aux couleurs de la charte, même nom partout, bio égale phrase de positionnement, coordonnées et horaires à jour, et un bouton d'action. »\n\nASTUCE\n- WhatsApp Business offre gratuitement un message d'accueil automatique, un catalogue et des réponses rapides.",visual:"profile",arrangement:"visual"},{n:23,part:2,layout:"workshop",workshop:"C",title:"Atelier C · Mon profil digital",screen:["1 cadre de téléphone","6 zones","10 min","Galerie 2 min"],notes:"MINUTAGE : 0:59 - 1:14 (15 min, EN LIGNE)\n\nÀ FAIRE AVANT DE LANCER\n- Dans l'autre onglet, ouvrez : votre-site/ateliers?atelier=C&projection=1 (QR code + mur en direct).\n\nCONSIGNE À DIRE\n« Même QR code, atelier C. Choisissez votre canal principal, page Facebook ou fiche Google, puis décrivez votre profil idéal en 6 zones : photo, bannière, nom, bio en 150 caractères maximum, coordonnées et bouton d'action. Si vous avez déjà une page, ouvrez-la et notez 3 corrections à faire. Envoyez : votre profil apparaît sur le mur. »\n\nPENDANT L'ATELIER\n- Minuteur lancé. Temps restant annoncé à 8 min puis à 2 min.\n- Vérifiez surtout la bio : c'est là que la phrase de positionnement se perd le plus souvent.\n\nDÉBRIEFING (3 min, sur le mur projeté)\n- Test des 5 secondes sur 2 ou 3 profils : en cachant le nom, sait-on de quoi parle la page ?\n- « Ceux qui ont trouvé 3 corrections : faites-les dès ce soir. »",visual:"phoneTemplate"},{n:24,part:2,layout:"section",module:"04",title:"Des contenus qui donnent envie",screen:[],notes:"MINUTAGE : 1:14\n\nÀ DIRE\n« La question que tout le monde se pose : mais qu'est-ce que je publie ? Réponse en cinq slides. »"},{n:25,part:2,layout:"content",kicker:"Module 4",title:"4 piliers de contenu",screen:["Montrer (produits, lieux)","Apprendre (conseils)","Coulisses (équipe, fabrication)","Preuves (avis, clients)"],notes:"MINUTAGE : 1:14 - 1:17\n\nÀ DIRE\n« Quatre piliers suffisent pour ne jamais manquer d'idées. Montrer : vos produits, vos lieux. Apprendre : un conseil, une astuce. Les coulisses : l'équipe, la fabrication. Les preuves : les avis et les clients satisfaits. Exemple pour une épicerie : la vanille en gros plan, comment conserver une gousse, la récolte avec le producteur, un client avec son colis. »",visual:"pillars",arrangement:"visual"},{n:26,part:2,layout:"content",kicker:"Module 4",title:"La règle 80/20",screen:["80 % utile, inspirant, divertissant","20 % « achetez »"],notes:"MINUTAGE : 1:17 - 1:19\n\nÀ FAIRE\n- Faites glisser le curseur vers 100 % de vente pour montrer l'effet.\n\nÀ DIRE\n« 80 % de contenus utiles, inspirants ou divertissants ; 20 % maximum pour dire \"achetez\". Une page qui ne fait que vendre ressemble à un vendeur qui vous suit dans la rue. »\n\nQUESTION AU GROUPE\n« Sur votre page, quelle est la proportion aujourd'hui ? » (Les rires sont garantis.)",visual:"rule8020",arrangement:"visual"},{n:27,part:2,layout:"content",kicker:"Module 4",title:"Les formats qui marchent",screen:["Vidéo courte verticale","Carrousel","Story","Avant/après","Accroche dans les 3 premières secondes"],notes:"MINUTAGE : 1:19 - 1:21\n\nÀ DIRE\n« Le format le plus mis en avant aujourd'hui, c'est la vidéo courte et verticale, de 15 à 30 secondes. Votre téléphone suffit : lumière du jour, téléphone stable, et des sous-titres, car beaucoup regardent sans le son. Tout se joue dans les 3 premières secondes : c'est l'accroche. »",visual:"formats",arrangement:"visual"},{n:28,part:2,layout:"content",kicker:"Module 4",title:"Raconter en 3 temps, même en 30 secondes",screen:["Avant : le problème","Le déclic : votre solution","Après : la transformation","Ton : je suis… mais pas…"],notes:"MINUTAGE : 1:21 - 1:24\n\nÀ DIRE\n« Même en 30 secondes, on peut raconter une histoire en trois temps : avant, le problème ; le déclic, votre solution ; après, la transformation. Exemple : les pêcheurs de Sakatia vendaient au prix le plus bas. En coopérative, ils ont créé leur marque. Aujourd'hui, les hôtels les appellent directement. »\n\nRAPPEL\n- Le ton défini dans la charte s'applique à chaque légende et à chaque réponse en commentaire.",visual:"story",arrangement:"visual"},{n:29,part:2,layout:"content",kicker:"Module 4",title:"Gagner du temps : modèles et calendrier",screen:["3 modèles Canva aux couleurs de la charte","1 calendrier","Planifier à l’avance","Régularité > quantité"],notes:"MINUTAGE : 1:24 - 1:26\n\nÀ DIRE\n« Pour tenir dans la durée : trois modèles Canva aux couleurs de votre charte, un calendrier sur deux semaines, et la programmation à l'avance avec Meta Business Suite, gratuit. Avec une connexion limitée, préparez tout hors ligne, puis programmez en une seule session connectée. Deux publications par semaine pendant trois mois valent mieux qu'une par jour pendant deux semaines. »",visual:"templates",arrangement:"split"},{n:30,part:2,layout:"workshop",workshop:"D",title:"Atelier D · Mes 2 prochaines semaines",screen:["6 publications","4 piliers","1 post rédigé en entier","13 min"],notes:"MINUTAGE : 1:26 - 1:42 (16 min, EN LIGNE)\n\nÀ FAIRE AVANT DE LANCER\n- Dans l'autre onglet, ouvrez : votre-site/ateliers?atelier=D&projection=1 (QR code + mur en direct).\n\nCONSIGNE À DIRE\n« Dernier atelier, le plus concret. Même QR code, atelier D : placez 6 publications sur vos 2 prochaines semaines, 3 par semaine. Pour chacune : le jour, le pilier, le format et l'idée en une ligne. Attention, une seule offre commerciale sur les 6 : l'outil vous le rappellera. Puis rédigez entièrement votre première publication : une accroche, deux ou trois phrases dans votre ton, et un appel à l'action. »\n\nPENDANT L'ATELIER\n- Minuteur lancé. Temps restant annoncé à 8 min puis à 2 min.\n- Les pastilles vertes sous le planning indiquent si les 4 piliers et la règle 80/20 sont respectés.\n\nDÉBRIEFING (3 min, sur le mur projeté)\n- Lisez à voix haute 2 ou 3 premiers posts : l'accroche donne-t-elle envie ? l'appel à l'action est-il clair ?\n- Engagement collectif : « Chacun publie son premier post dans les 48 heures. »",visual:"calendarTemplate"},{n:31,part:2,layout:"section",module:"05",title:"Booster ce qui marche, mesurer ce qui compte",screen:[],notes:"MINUTAGE : 1:42\n\nÀ DIRE\n« Dernière étape : comment aller plus loin sans gaspiller son argent. »"},{n:32,part:2,layout:"content",kicker:"Module 5",title:"La publicité à petit budget",screen:["Booster un post qui marche déjà","1 objectif : messages","Cible : zone, âge, intérêts","Budget fixe, durée courte"],notes:"MINUTAGE : 1:42 - 1:46\n\nÀ DIRE\n« Règle d'or : on ne booste qu'une publication qui a déjà bien marché gratuitement. Choisissez l'objectif \"messages\" pour recevoir des contacts sur WhatsApp ou Messenger, plutôt que des \"j'aime\". Ciblez une zone, un âge, des centres d'intérêt, et fixez un budget à l'avance, sur 3 à 5 jours. Puis comparez. »\n\nPIÈGE À ÉVITER\n- Cibler « tout Madagascar » pour une activité locale.",visual:"budget",arrangement:"split"},{n:33,part:2,layout:"content",kicker:"Module 5",title:"3 chiffres à suivre chaque mois",screen:["Portée : combien m’ont vu ?","Engagement : combien ont réagi ?","Contacts : combien m’ont écrit ?","+ les avis Google"],notes:"MINUTAGE : 1:46 - 1:50\n\nÀ DIRE\n« Chaque mois, suivez trois chiffres, gratuits dans vos statistiques ou dans Meta Business Suite. La portée : combien de personnes vous ont vu. L'engagement : combien ont réagi. Et surtout les contacts : combien vous ont écrit, car ce sont eux qui mènent à la vente. Et à chaque client satisfait, demandez un avis Google : c'est la preuve la plus visible pour un touriste. »",visual:"metrics",arrangement:"visual"},{n:34,part:2,layout:"content",kicker:"Synthèse",title:"Ce qu’on retient",screen:["Positionnement d’abord","Moins, c’est plus","2 canaux bien tenus","Régularité","Mesurer, puis amplifier"],notes:"MINUTAGE : 1:50 - 1:52\n\nÀ FAIRE\n- Avant d'afficher la slide, demandez : « Si vous ne deviez retenir qu'une chose ? » Laissez 3 réponses.\n\nÀ DIRE\n« Le positionnement d'abord. Moins, c'est plus : trois couleurs, deux polices. Deux canaux bien tenus. La régularité avant la quantité. Et on mesure avant d'amplifier. »",visual:"takeaways",arrangement:"visual"},{n:35,part:2,layout:"quiz",title:"Quiz éclair",screen:["5 questions","Levez 1, 2 ou 3 doigts"],notes:"MINUTAGE : 1:52 - 1:57\n\nÀ FAIRE\n- 5 questions, une par écran. Les participants lèvent 1, 2 ou 3 doigts.\n- Notez les votes avec les compteurs, puis cliquez sur « Afficher la réponse ».\n- Expliquez chaque réponse en une phrase, sans s'attarder.\n\nÀ DIRE\n« Petit quiz éclair, pas de piège, et pas besoin de téléphone : levez simplement 1, 2 ou 3 doigts. »",steps:6},{n:36,part:2,layout:"end",title:"À vous de jouer",screen:["3 actions","dans les 30 jours","Merci !"],notes:"MINUTAGE : 1:57 - 2:00\n\nÀ FAIRE\n- Demandez à chacun de noter 3 actions à faire dans les 30 jours, par exemple : mettre à jour sa bio, créer sa fiche Google, publier son premier post lundi.\n\nÀ DIRE\n« Merci pour votre énergie ce matin. Vous repartez avec une phrase de positionnement, une charte, un profil et un calendrier : tout est sur le mur en ligne : gardez le lien du site. Envoyez-moi le lien de votre page d'ici un mois : je serai ravi de voir ce que vous en avez fait. »\n\nÀ FAIRE APRÈS\n- Laissez vos coordonnées affichées. Terminez à l'heure."}],Ys={date:"24/11/2026",lieu:"B-Lossom Center",animateur:"Hugues Hamba",coordonnees:["Hugues Hamba","[Téléphone]","[E-mail]"],parts:{1:"Identité visuelle",2:"Marketing digital"},pauseMinutes:8},ex={A:{key:"A",minutes:10,duree:"10 min",format:"Seul puis binôme",objectif:"Formuler ce qui rend son projet unique, pour qui et pourquoi",materiel:"Fiche avec la formule à trous, stylo, post-it",consigne:"« Complétez : Pour [cible] qui [besoin], [marque] est [catégorie] qui [bénéfice unique], grâce à [preuve]. Lisez-la une fois à votre binôme. Il doit la répéter avec ses mots. S’il n’y arrive pas, simplifiez. »",debriefing:"Faites lire 2 ou 3 phrases et posez 3 questions. La cible est-elle précise (pas « tout le monde ») ? Le bénéfice se distingue-t-il des concurrents ? La preuve est-elle vérifiable ? Annoncez que cette phrase servira de bio à l’atelier C."},B:{key:"B",minutes:13,duree:"13 min",format:"En ligne, sur téléphone",objectif:"Fixer sur une page les choix visuels et le ton de sa marque",materiel:"Gabarit A4 à 5 cases, crayons de couleur, magazines à découper ; en option Coolors.co si le réseau le permet",consigne:"« Remplissez les 5 cases. 1. Mes 3 mots d’ambiance. 2. Mes couleurs : 1 principale, 1 accent, 1 neutre, choisies sur le cercle chromatique, coloriées et nommées (code HEX si vous l’avez). 3. Mon nom de marque écrit dans 2 styles : titres et texte. 4. Mon style d’images en 3 mots, avec 1 ou 2 images collées ou dessinées. 5. Mon ton : je suis… mais pas…, et 2 interdits. »",debriefing:"Le binôme regarde la charte sans lire la case 1 et devine les 3 mots d’ambiance. S’il les trouve, la charte fonctionne. Il vérifie aussi le contraste : le nom de marque se lit-il à 2 mètres ? Les chartes s’affichent ensuite sur le mur en ligne, avec le nom de chacun."},C:{key:"C",minutes:15,duree:"15 min",format:"En ligne, sur téléphone",objectif:"Décliner sa mini-charte sur son profil Facebook, Instagram ou WhatsApp Business",materiel:"Gabarit A4 « cadre de téléphone » à 6 zones, crayons de couleur, mini-charte de l’atelier B, téléphone personnel",consigne:"« Choisissez votre canal principal. Dans le cadre de téléphone, dessinez votre profil idéal. 1. Photo de profil : votre logo en version carrée. 2. Bannière : couleurs et image de votre charte. 3. Nom : identique sur tous vos canaux. 4. Bio : votre phrase de positionnement, en 150 caractères maximum. 5. Coordonnées : téléphone, lieu, horaires. 6. Bouton d’action : « Envoyer un message », « Réserver » ou « Appeler ». Si vous avez déjà une page, ouvrez-la et notez 3 corrections à faire. »",debriefing:"Les maquettes sont posées sur les tables. Le groupe fait le tour 2 minutes et applique le test des 5 secondes : en cachant le nom, sait-on de quoi parle la page ? Demandez qui a trouvé 3 corrections à faire sur sa vraie page, et invitez-les à les faire dès ce soir."},D:{key:"D",minutes:16,duree:"16 min",format:"En ligne, sur téléphone",objectif:"Planifier 6 publications réalistes et rédiger la première",materiel:"Gabarit de calendrier de 2 semaines (colonnes : jour, pilier, format, idée, appel à l’action), stylo",consigne:"« 1. Placez 6 publications sur 2 semaines, soit 3 par semaine. 2. Pour chacune, notez le pilier (montrer, apprendre, coulisses, preuve), le format (photo, vidéo courte, carrousel, story) et l’idée en une ligne. 3. Une seule sur les 6 peut être une offre commerciale directe. 4. Rédigez en entier la première publication : une accroche, 2 ou 3 phrases dans votre ton, un appel à l’action. »",debriefing:"Le binôme vérifie 3 points : les 4 piliers sont-ils représentés ? La règle 80/20 est-elle respectée ? L’appel à l’action est-il clair ? Faites lire 2 ou 3 posts à voix haute. Engagez chacun à publier le premier post dans les 48 heures."}},yi=[{theme:"Identité",question:"Quelle est la différence entre un logo et une identité visuelle ?",options:["Il n’y en a pas, ce sont des synonymes","Le logo est un élément de l’identité visuelle, qui comprend aussi couleurs, polices, images et ton","L’identité visuelle ne concerne que le site web"],answer:2,explanation:"Le logo est la signature ; l’identité visuelle est la tenue complète."},{theme:"Identité",question:"Selon la règle 60-30-10, à quoi servent les 10 % ?",options:["À la couleur d’accent, pour attirer l’œil sur l’essentiel","Au fond de page","Aux textes longs"],answer:1,explanation:"60 % de neutre, 30 % de couleur principale, 10 % d’accent."},{theme:"Digital",question:"Vous démarrez avec peu de temps. Quelle stratégie de canaux choisir ?",options:["Être présent sur tous les réseaux pour toucher un maximum de monde","Choisir 2 canaux où se trouve votre cible, et les tenir régulièrement","Attendre d’avoir un site web professionnel"],answer:2,explanation:"2 canaux bien tenus valent mieux que 6 abandonnés ; la régularité construit la confiance."},{theme:"Digital",question:"Selon la règle 80/20, que doivent être la majorité de vos publications ?",options:["Des offres et des promotions","Des contenus utiles, inspirants ou divertissants","Des photos de votre logo"],answer:2,explanation:"80 % de valeur, 20 % de vente : une page qui ne fait que vendre perd son public."},{theme:"Digital",question:"Quand faut-il payer pour booster une publication ?",options:["Dès la création de la page, pour avoir des abonnés","Pour chaque publication, sans exception","Quand une publication a déjà bien fonctionné gratuitement, avec un objectif et un budget fixés"],answer:3,explanation:"La publicité amplifie ce qui marche déjà ; elle ne répare pas un contenu faible."}],jc=[{start:0,end:6,label:"Accueil et brise-glace",format:"Plénier",from:1,to:3},{start:6,end:13,label:"Module 1 : fondations de la marque",format:"Exposé interactif",from:4,to:7},{start:13,end:23,label:"Atelier A : ma phrase de positionnement",format:"Seul puis binôme",from:8,to:8},{start:23,end:36,label:"Module 2 : éléments visuels",format:"Exposé interactif",from:9,to:16},{start:36,end:49,label:"Atelier B : ma mini-charte express (en ligne)",format:"Seul, mur en ligne",from:17,to:17},{start:49,end:59,label:"Module 3 : stratégie digitale et canaux",format:"Exposé interactif",from:18,to:22},{start:59,end:74,label:"Atelier C : mon profil digital cohérent (en l
